<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE HAND v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d16;color:#eef4ff;font:16px system-ui;min-height:100vh;padding:14px}
main{max-width:650px;margin:auto}h1{font-size:25px;margin:5px 0}p{color:#aab7cc;line-height:1.4}
.panel{background:#121b2b;border:1px solid #263750;border-radius:16px;padding:13px;margin:11px 0}
button{background:#4c8dff;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;width:100%}
button:disabled{opacity:.5}#view{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden}
video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#status{font-weight:700;color:#ffc66d}.muted{color:#91a2bc;font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}.pill{background:#1d2b40;border-radius:99px;padding:7px 10px;font-size:13px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{background:#1d2b40;color:#aab7cc;padding:11px 8px;transition:background .2s,color .2s}.seg button.on{background:#4c8dff;color:#fff}
input[type=range]{width:100%;margin:8px 0 0}label{font-size:14px;display:flex;justify-content:space-between}
</style>
</head>
<body><main>
<h1>✋ LIVE HAND <small class="muted">v3.2 · WEBSOCKET</small></h1>
<div class="panel">
<div id="view"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div>
<div class="row"><span id="status">Ожидание запуска</span><span class="pill" id="fps">0 FPS</span></div>
</div>
<div class="panel">
<div class="seg"><button id="m1">1 рука</button><button id="m2" class="on">2 руки</button></div>
<button id="start">Запустить трекер</button>
<div class="row"><span class="pill" id="hands">Руки: 0 / 2</span><span class="pill" id="server">Сервер: проверка…</span><span class="pill" id="lat">Пинг: –</span></div>
<label style="margin-top:14px"><span>Усиление света</span><span id="gainv">1.0×</span></label>
<input type="range" id="gain" min="1" max="2.8" step="0.1" value="1">
<p class="muted">Поднимай усиление при слабом освещении. Оставь страницу открытой и не сворачивай Chrome: Android может остановить камеру в фоне.</p>
</div>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("canvas"),ctx=canvas.getContext("2d",{alpha:true});
const statusEl=$("status"),handsEl=$("hands"),serverEl=$("server"),fpsEl=$("fps"),latEl=$("lat"),gainEl=$("gain"),gainV=$("gainv");
const WIDTH=480,HEIGHT=360;
let maxHands=2,landmarker=null,running=false,frames=0,lastFps=performance.now(),lastTs=0,lastEmptySend=0;
const LINKS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// ---------- режим: 1 или 2 руки ----------
function applyMode(n,save){
 maxHands=n;
 $("m1").classList.toggle("on",n===1);$("m2").classList.toggle("on",n===2);
 handsEl.textContent="Руки: 0 / "+n;
 if(landmarker)landmarker.setOptions({numHands:n}).catch(e=>console.error(e));
 if(save){try{localStorage.setItem("lh_hands",String(n))}catch(e){}}
}
$("m1").addEventListener("click",()=>applyMode(1,true));
$("m2").addEventListener("click",()=>applyMode(2,true));
try{const saved=parseInt(localStorage.getItem("lh_hands"));if(saved===1||saved===2)applyMode(saved,false)}catch(e){}

// ---------- освещение: яркость/контраст перед MediaPipe ----------
const boost=document.createElement("canvas");boost.width=WIDTH;boost.height=HEIGHT;
const bctx=boost.getContext("2d");
let gain=1;
gainEl.addEventListener("input",()=>{gain=parseFloat(gainEl.value);gainV.textContent=gain.toFixed(1)+"×"});

// ---------- передача: WebSocket, запасной вариант HTTP ----------
let ws=null,wsOpen=false,postBusy=false,lastPost=0,pingAt=0;
function connectWS(){
 const url=(location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws?role=camera";
 ws=new WebSocket(url);
 ws.onopen=()=>{wsOpen=true;serverEl.textContent="Сервер: WebSocket"};
 ws.onclose=()=>{wsOpen=false;serverEl.textContent="Сервер: HTTP (запас)";setTimeout(connectWS,1000)};
 ws.onerror=()=>{try{ws.close()}catch(e){}};
 ws.onmessage=e=>{if(pingAt&&e.data.indexOf("pong")>=0){latEl.textContent="Пинг: "+Math.round(performance.now()-pingAt)+" мс";pingAt=0}};
}
setInterval(()=>{if(wsOpen&&!pingAt){pingAt=performance.now();ws.send('{"ping":true}')}},2000);
async function postPose(data){
 if(postBusy)return;postBusy=true;
 try{await fetch("/pose",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),cache:"no-store",keepalive:true})}
 catch(e){serverEl.textContent="Сервер: ошибка"}finally{postBusy=false}
}
function send(hands,now){
 if(!hands.length){ if(now-lastEmptySend<100)return; lastEmptySend=now; }
 const data={hands};
 if(wsOpen){ if(ws.bufferedAmount<16384)ws.send(JSON.stringify(data)); }   // отстаём - пропускаем кадр
 else if(now-lastPost>=34){lastPost=now;postPose(data)}
}

// ---------- распознавание ----------
function processFrame(){
 const now=performance.now();
 let ts=now;if(ts<=lastTs)ts=lastTs+0.01;lastTs=ts;      // метки времени строго растут
 let src=video;
 if(gain>1.01){
  bctx.filter="brightness("+gain+") contrast("+(1+(gain-1)*0.35)+")";
  bctx.drawImage(video,0,0,WIDTH,HEIGHT);
  src=boost;
 }
 const result=landmarker.detectForVideo(src,ts);
 const landmarks=result.landmarks||[],handed=result.handedness||[],hands=[];
 ctx.clearRect(0,0,WIDTH,HEIGHT);
 for(let h=0;h<landmarks.length&&h<maxHands;h++){
  const hand=landmarks[h],label=handed[h]?.[0]?.categoryName||(h===0?"Right":"Left"),color=label==="Left"?"#ff8bcb":"#52d7ff";
  ctx.strokeStyle=color;ctx.fillStyle="#ffffff";ctx.lineWidth=2;
  for(const [a,b] of LINKS){ctx.beginPath();ctx.moveTo(hand[a].x*WIDTH,hand[a].y*HEIGHT);ctx.lineTo(hand[b].x*WIDTH,hand[b].y*HEIGHT);ctx.stroke()}
  for(const p of hand){ctx.beginPath();ctx.arc(p.x*WIDTH,p.y*HEIGHT,2.7,0,Math.PI*2);ctx.fill()}
  hands.push({handedness:label,score:handed[h]?.[0]?.score||0,points:hand.map(p=>({x:1-p.x,y:p.y,z:p.z||0}))});
 }
 send(hands,now);
 handsEl.textContent="Руки: "+hands.length+" / "+maxHands;statusEl.textContent=hands.length?"Трекинг активен":"Покажи руки камере";
 frames++;if(now-lastFps>=1000){fpsEl.textContent=frames+" FPS";frames=0;lastFps=now}
}

// обрабатываем только новые кадры камеры, без жёсткого лимита 30 FPS
function startLoop(){
 if("requestVideoFrameCallback" in HTMLVideoElement.prototype){
  const cb=()=>{if(!running)return;try{processFrame()}catch(e){console.error(e)}video.requestVideoFrameCallback(cb)};
  video.requestVideoFrameCallback(cb);
 }else{
  let lastT=-1;
  const loop=()=>{if(!running)return;
   if(video.readyState>=2&&video.currentTime!==lastT){lastT=video.currentTime;try{processFrame()}catch(e){console.error(e)}}
   requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
 }
}

async function init(){
 statusEl.textContent="Загрузка модели…";
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 landmarker=await HandLandmarker.createFromOptions(vision,{
  baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
  runningMode:"VIDEO",numHands:maxHands,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5
 });
 const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:WIDTH},height:{ideal:HEIGHT},frameRate:{ideal:60}}});
 video.srcObject=stream;await video.play();canvas.width=WIDTH;canvas.height=HEIGHT;
 running=true;statusEl.textContent="Ищу руки…";startLoop();
}
$("start").addEventListener("click",async e=>{
 e.currentTarget.disabled=true;
 try{await init();e.currentTarget.textContent="Трекер запущен"}
 catch(err){console.error(err);statusEl.textContent="Ошибка: "+(err.message||err);e.currentTarget.disabled=false}
});
connectWS();
</script></main></body></html>
